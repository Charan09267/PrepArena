services:

  # =====================================================
  # MYSQL
  # =====================================================

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - microservices-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =====================================================
  # KAFKA
  # =====================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - microservices-network


  # =====================================================
  # EUREKA SERVER
  # =====================================================

  eureka-service:
    build:
      context: .
      dockerfile: ServiceRegistry/Dockerfile

    container_name: eureka-service

    ports:
      - "8761:8761"

    networks:
      - microservices-network


  # =====================================================
  # API GATEWAY
  # =====================================================

  api-gateway:
    build:
      context: .
      dockerfile: ApiGateWay/Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

    depends_on:
      - eureka-service
      - user-service
      - contest-service
      - attempt-service

    networks:
      - microservices-network


  # =====================================================
  # USER SERVICE
  # =====================================================

  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile

    container_name: user-service

    ports:
      - "8082:8082"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/users_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root123

    depends_on:
      mysql:
        condition: service_healthy

      eureka-service:
        condition: service_started

    networks:
      - microservices-network


  # =====================================================
  # CONTEST SERVICE
  # =====================================================

  contest-service:
    build:
      context: .
      dockerfile: ContestService/Dockerfile

    container_name: contest-service

    ports:
      - "8083:8083"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contest_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root123

    depends_on:
      mysql:
        condition: service_healthy

      eureka-service:
        condition: service_started

    networks:
      - microservices-network


  # =====================================================
  # ATTEMPT SERVICE
  # =====================================================

  attempt-service:
    build:
      context: .
      dockerfile: AttemptService/Dockerfile

    container_name: attempt-service

    ports:
      - "8084:8084"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/attempt_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_started

      eureka-service:
        condition: service_started

    networks:
      - microservices-network


  # =====================================================
  # EVALUATION SERVICE
  # =====================================================

  evaluation-service:
    build:
      context: .
      dockerfile: EvaluationService/Dockerfile

    container_name: evaluation-service

    ports:
      - "8085:8085"

    environment:

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:

      kafka:
        condition: service_started

      eureka-service:
        condition: service_started

    networks:
      - microservices-network


# =====================================================
# NETWORK
# =====================================================

networks:

  microservices-network:
    driver: bridge


# =====================================================
# VOLUMES
# =====================================================

volumes:

  mysql_data:

  kafka_data: